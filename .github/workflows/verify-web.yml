name: Web Pages Verification

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/verify-web.yml'
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/verify-web.yml'
  workflow_dispatch:

concurrency:
  group: verify-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build web pages and bundle
        run: node web/build-pages.js

      - name: Verify static pages
        run: node web/verify-pages.js

      - name: Verify CSS classes
        run: node web/verify-css.js
